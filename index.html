<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПLОМБИР | Из города в деревню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        
        <section id="screen-gender" class="screen active">
            <div class="header-box">
                <span class="top-badge">#PLMBR</span>
                <h1>ИЗ ГОРОДА<br>В ДЕРЕВНЮ</h1>
            </div>
            <p class="instruction">ВЫБЕРИ СВОЮ КАТЕГОРИЮ</p>
            <div class="choice-container">
                <button class="choice-btn" onclick="selectGender('boys')">
                    <span class="emoji">🚜</span>
                    <span class="btn-text">ПАРЕНЬ</span>
                    <span class="btn-sub">Спорт-шик х Огород</span>
                </button>
                <button class="choice-btn" onclick="selectGender('girls')">
                    <span class="emoji">🌾</span>
                    <span class="btn-text">ДЕВУШКА</span>
                    <span class="btn-sub">Сельский Гламур</span>
                </button>
            </div>
        </section>

        <section id="screen-preview" class="screen hidden">
            <h2 id="preview-category-title">ТВОЙ ЛУК</h2>
            <div class="items-list" id="itemsListContainer">
                </div>
            <button class="main-action-btn" onclick="goToPhotoUpload()">ПРИМЕРИТЬ ЭТОТ ОБРАЗ</button>
        </section>

        <section id="screen-upload" class="screen hidden">
            <h2>ТВОЕ ФОТО</h2>
            <p class="upload-desc">Загрузи селфи, чтобы мы внедрили твое лицо в готовый славянский постер</p>
            
            <label class="file-upload-box" id="dropZone">
                <input type="file" id="selfieInput" accept="image/*" onchange="handleImageUpload(event)">
                <span id="uploadLabelText">📸 Выбрать или сделать селфи</span>
            </label>

            <div class="preview-avatar-container hidden" id="avatarPreviewContainer">
                <img id="avatarPreviewImg" src="" alt="Твое фото">
                <span class="change-photo-text">Нажми, чтобы сменить фото</span>
            </div>

            <button id="generateBtn" class="main-action-btn hidden" onclick="startGenerationProcess()">СОЗДАТЬ ПОСТЕР</button>
        </section>

        <section id="screen-loading" class="screen hidden">
            <div class="loader-spinner"></div>
            <p id="loading-status-text">Стряхиваем пыль с олимпийки...</p>
        </section>

        <section id="screen-result" class="screen hidden">
            <div class="canvas-wrapper">
                <canvas id="posterCanvas"></canvas>
            </div>
            <div class="result-actions">
                <button class="main-action-btn" onclick="sendPosterToBot()">ПОДЕЛИТЬСЯ В ЧАТЕ</button>
                <button class="secondary-action-btn" onclick="resetApp()">ДРУГОЙ ЛУК</button>
            </div>
        </section>

    </div>
    <script src="script.js"></script>
</body>
</html>
